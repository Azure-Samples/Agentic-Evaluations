[project]
name = "Agentic_Evaluation_Framework"
version = "0.1.0"
description = "A config-driven evaluation framework for agentic systems and GenAI applications built on Azure AI Foundry SDK"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Azure SDK dependencies
    "azure-identity>=1.25.0",
    "azure-ai-projects",
    "azure-ai-evaluation==1.15.0",
    "azure-ai-inference>=1.0.0b9",
    # Core Python packages
    "python-dotenv>=1.2.1",
    "pyyaml>=6.0.2",
    "pip-system-certs",
    "azure-monitor-query>=2.0.0",
    "azure-monitor-opentelemetry>=1.8.4",
    "agent-framework==1.0.0b260116",
    "agent-framework-azure-ai==1.0.0rc2",
    "aiohttp>=3.13.2"
]

[tool.uv]
prerelease = "allow"
