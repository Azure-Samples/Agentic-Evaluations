app_name: Agent-Evals
version: 1.0.0
experiment_name: Agent_Evaluation_Experiment
evaluation:
  run_local: False
  input_path: src/evaluations/offline/agent_evaluation_foundry/datasets/
  input_file: agent_sample.jsonl
  output_path: src/evaluations/offline/agent_evaluation_foundry/report/
  column_mapping:
    user_id: "${data.query}"
  evaluators:
    relevance_score: "relevance_evaluator"
    task_adherence_score: "task_adherence_evaluator"
    tool_call_accuracy_score: "tool_call_accuracy_evaluator"
  evaluator_config:
    relevance_score:
      column_mapping:
        query: "${data.query}"
        response: "${data.response}"
    task_adherence_score:
      column_mapping:
        query: "${data.query}"
        response: "${data.response}"
    tool_call_accuracy_score:
      column_mapping:
        query: "${data.query}"
        tool_calls: "${data.tool_calls}"
        tool_definitions: "${data.tool_definitions}"
pipeline:
  - base_path: evaluator
    module: eval_main.eval_main
    config_key: evaluation
